name: Deploy to EC2

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/muntum-key.pem
          chmod 600 ~/.ssh/muntum-key.pem

      - name: Create secrets-prod.yml on EC2
        run: |
          ssh -i ~/.ssh/muntum-key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "echo '${{ secrets.SECRETS_PROD_YML }}' | base64 -d > /home/ubuntu/muntum/app/secrets-prod.yml"

      - name: Stop service before upload
        run: |
          ssh -i ~/.ssh/muntum-key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo systemctl stop muntum"

      - name: Upload JAR to EC2
        run: |
          scp -i ~/.ssh/muntum-key.pem \
            -o StrictHostKeyChecking=no \
            build/libs/muntum-0.0.1-SNAPSHOT.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/muntum/app/muntum.jar

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/muntum-key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo systemctl start muntum && sleep 10 && sudo journalctl -u muntum -n 50 --no-pager"
          
          
      - name: Discord deployment success notification
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PR_TITLE=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq 'map(select(.base.ref == "main" and .merged_at != null)) | .[0].title // empty')

          if [ -z "$PR_TITLE" ]; then
            echo "연결된 PR이 없어 Discord 알림 생략합니다."
            exit 0
          fi

          MESSAGE=$(printf 'Muntum 운영 서버 배포 완료!\n%s' "$PR_TITLE")

          PAYLOAD=$(jq -n \
            --arg content "$MESSAGE" \
            '{content: $content, allowed_mentions: {parse: []}}')

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"